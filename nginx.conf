server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing (react-router-dom): fall back to index.html for any path
    # that isn't a real static file, so client-side routes don't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
